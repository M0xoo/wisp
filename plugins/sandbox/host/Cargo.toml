[package]
name = "wisp-sandbox"
description = "wisp.sandbox host: sandboxes on the user's wisp Grid for a task, a delegate, a crew job or member, a goal's judges; seeded with the project, deleted with their owner (ADR-0047)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
tracing.workspace = true
wisp-grid-client-api.workspace = true
wisp-kernel.workspace = true
wisp-machines-api.workspace = true
wisp-proc.workspace = true
wisp-runtime-api.workspace = true
wisp-crew-api.workspace = true
wisp-sandbox-api.workspace = true
wisp-sandbox-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
wisp-testkit.workspace = true

[lints]
workspace = true
