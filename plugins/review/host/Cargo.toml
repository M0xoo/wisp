[package]
name = "wisp-review"
description = "wisp.review: review by another harness on a task's PR head, with the tests run again on it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wisp-kernel.workspace = true
wisp-git-api.workspace = true
wisp-review-api.workspace = true
wisp-review-core.workspace = true
# not yet a workspace dependency (root Cargo.toml is the lead's): path until it is
wisp-runtime-api = { path = "../../runtime/api" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
