<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allowance board</title>
<link rel="stylesheet" href="/_wisp/pane.css">
<style>
  html { height: auto; }
  #note { margin: 0 0 8px; color: var(--muted); }
  #note:empty { display: none; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 8px; align-items: start; }
  .card { display: grid; gap: 8px; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .head b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate { flex: none; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .none { font-size: 12.5px; color: var(--muted); }
  /* Fixed columns: percentages and reset times line up across windows and accounts; each bar runs the card's width under its line. */
  .win { display: grid; grid-template-columns: 56px 4ch minmax(0, 1fr); gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .win > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct, .when { text-align: right; }
  .pct { color: var(--ink); }
  .win.high .pct { color: var(--bad); }
  .bar { grid-row: 2; grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--ink-2); transition: width 0.3s var(--ease); }
  .win.high .bar i { background: var(--bad); }
  /* A window's recent periods. Fixed columns, the same in every window and card; the period takes what's left. */
  .hist { grid-row: 3; grid-column: 1 / -1; width: 100%; margin-top: 4px; table-layout: fixed; border-collapse: collapse; font-size: 11.5px; line-height: 1.4; }
  .hist col.c-out { width: 78px; }
  .hist col.c-used { width: 38px; }
  .hist col.c-cost { width: 84px; }
  .hist th, .hist td { padding: 1px 0 1px 6px; font-weight: 400; text-align: right; vertical-align: baseline; white-space: nowrap; overflow: hidden; }
  .hist th:first-child, .hist td:first-child { padding-left: 0; text-align: left; }
  .hist thead th { padding-bottom: 2px; color: var(--faint); border-bottom: 1px solid var(--line); }
  .hist tbody tr:first-child > * { padding-top: 3px; }
  .hist tbody th { white-space: normal; }
  .hist tbody th span { white-space: nowrap; }
  .hist .early { color: var(--faint); }
  .hist .out { color: var(--ink-2); }
  .hist td.moved { padding: 0 0 2px; color: var(--faint); text-align: left; white-space: normal; overflow-wrap: anywhere; }
  .reading { grid-row: 4; grid-column: 1 / -1; margin: 2px 0 0; font-size: 11.5px; line-height: 1.4; overflow-wrap: anywhere; }
  #foot { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  #foot:empty { display: none; }
  /* The narrowest tiles: Outside wisp takes two lines and the columns close up. */
  @media (max-width: 320px) {
    .hist thead th { white-space: normal; vertical-align: bottom; }
    .hist col.c-out { width: 50px; }
    .hist col.c-used { width: 36px; }
    .hist col.c-cost { width: 58px; }
  }
  .ph .sk { height: 11px; border-radius: 6px; }
  .ph .head .sk { width: 40%; }
  .ph .bar i { height: 100%; background: var(--bg-2); }
  .ph .hist td .sk { width: 32px; height: 9px; margin: 3px 0 3px auto; }
  .ph .hist td:first-child .sk { width: 56px; margin-left: 0; }
</style>
</head>
<body>
<p id="note" role="status"></p>
<div id="list">
  <article class="card ph" aria-hidden="true">
    <div class="head"><i class="sk"></i></div>
    <div class="win">
      <i class="sk"></i><i class="sk"></i><i></i>
      <div class="bar"><i class="sk"></i></div>
      <table class="hist">
        <colgroup><col><col class="c-out"><col class="c-used"><col class="c-cost"></colgroup>
        <tbody>
          <tr><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td></tr>
          <tr><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td></tr>
          <tr><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td></tr>
          <tr><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td></tr>
          <tr><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td><td><i class="sk"></i></td></tr>
        </tbody>
      </table>
    </div>
  </article>
</div>
<p id="foot"></p>
<script src="/_wisp/pane.js"></script>
<script>
  const list = document.getElementById('list');
  const note = document.getElementById('note');
  const foot = document.getElementById('foot');
  list.append(list.firstElementChild.cloneNode(true)); // two placeholder cards, one in the markup
  const cards = new Map(); // agent and account -> { node, head, rate, none, wins: window id -> its nodes }
  const SHOWN = 4; // periods in a window's history
  const DAY = 24 * 3600_000;
  const DASH = '–';
  const add = (parent, tag, cls) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    parent.append(n);
    return n;
  };
  // Writes only what changed: a refresh that changes nothing touches nothing.
  const put = (node, text) => {
    if (node.textContent !== text) node.textContent = text;
  };
  const tip = (node, text) => {
    if (node.title !== text) node.title = text;
  };
  const show = (node, on) => {
    if (node.hidden === on) node.hidden = !on;
  };
  const pctOf = (x) => (x > 0 && x < 0.005 ? '<1%' : `${Math.round(x * 100)}%`);
  // $11.40, or 0.40M in tokens. Under a cent it says so: $0.00 would read as free.
  function amount(x, unit, rough) {
    const [pre, post] = unit === 'usd' ? ['$', ''] : ['', 'M'];
    return `${rough ? '≈' : ''}${x < 0.005 ? `<${pre}0.01` : `${pre}${x.toFixed(2)}`}${post}`;
  }
  const endOf = (at) => {
    const d = new Date(at);
    return `${d.toLocaleDateString('en', { weekday: 'short' })} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };
  // A window of a day or longer ends at the same weekday and time each period: only a date tells its rows apart.
  const dayOf = new Intl.DateTimeFormat([], { day: 'numeric', month: 'short' });
  // What moved in the CLI, in the text: phones have no hover.
  function movedIn(name, cli) {
    const what = [cli.tools && 'tool set changed', cli.catalog && 'model catalog changed'].filter(Boolean);
    const words = cli.version ? [`${name} ${cli.version[0]} → ${cli.version[1]}`, ...what].join(', ') : `${name}: ${what.join(', ')}`;
    return `${words}. Possible cause, not proof.`;
  }
  // Whether 1% buys what it did, or '' when wisp has nothing to say. It can't know why.
  // said: the CLI lines already on the rows shown, which it doesn't repeat.
  function readingOf(s, name, said) {
    if (!s || s.change === null || s.recent === null || s.before === null) return '';
    const vs = `${amount(s.recent, s.unit, s.rough)} vs ${amount(s.before, s.unit, s.rough)}${s.unit === 'usd' ? '' : ' tokens'}`;
    const line = s.state === 'same'
      ? `No change: 1% did about the same work as the 2 weeks before (${vs}).`
      : `1% did ${Math.round(Math.abs(s.change) * 100)}% ${s.state} work than the 2 weeks before (${vs}). That can be the work itself, not your plan.`;
    const moved = s.cli ? movedIn(name, s.cli) : '';
    return moved && !said.includes(moved) ? `${line} ${moved}` : line;
  }
  function resetsIn(at) {
    if (!at) return 'no reset time';
    const m = Math.max(0, Math.round((at - Date.now()) / 60000));
    if (m < 60) return `resets in ${m}m`;
    const h = Math.floor(m / 60);
    return h < 48 ? `resets in ${h}h ${m % 60}m` : `resets in ${Math.round(h / 24)}d`;
  }
  // No burn rate (null) is no line at all: wisp can't tell yet, which isn't 0.
  function rateOf(r) {
    if (r.burnPerHour === null || r.burnPerHour === undefined) return '';
    const n = Math.round(r.burnPerHour * 100);
    return `${r.burnWindow ? `${r.burnWindow}: ` : ''}${n < 1 ? 'under 1%' : `${n}%`} an hour`;
  }
  function makeCard() {
    const node = document.createElement('article');
    node.className = 'card';
    const head = add(node, 'div', 'head');
    const card = { node, name: add(head, 'b'), rate: add(head, 'span', 'rate'), none: add(node, 'span', 'none'), wins: new Map() };
    card.none.textContent = 'This harness reports no usage windows yet.';
    return card;
  }
  function makeWin(card, w) {
    const node = add(card.node, 'div', 'win');
    const win = { node, label: add(node, 'span'), pct: add(node, 'span', 'pct') };
    const bar = add(node, 'div', 'bar');
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', '100');
    bar.setAttribute('aria-label', w.label);
    win.bar = bar;
    win.fill = add(bar, 'i');
    win.when = add(node, 'span', 'when');
    makeHist(win, w);
    win.reading = add(node, 'p', 'reading');
    win.reading.hidden = true;
    return win;
  }
  // The table and its rows are made once and reused: a refresh only writes what changed.
  function makeHist(win, w) {
    const table = add(win.node, 'table', 'hist');
    table.setAttribute('aria-label', `${w.label}: recent periods`);
    table.hidden = true;
    const cols = add(table, 'colgroup');
    for (const c of ['', 'c-out', 'c-used', 'c-cost']) add(cols, 'col', c);
    const head = add(add(table, 'thead'), 'tr');
    const heads = ['Period', 'Outside wisp', 'Used', 'For 1%'].map((text) => {
      const th = add(head, 'th');
      th.scope = 'col';
      th.textContent = text;
      return th;
    });
    heads[1].title = 'Used, less what went through wisp. It can read low.';
    heads[3].title = 'The work 1% of this window took.';
    win.cost = heads[3];
    const body = add(table, 'tbody');
    win.hist = table;
    win.rows = Array.from({ length: SHOWN }, () => {
      const node = add(body, 'tr');
      const when = add(node, 'th');
      when.scope = 'row';
      const row = { node, end: add(when, 'span'), early: null, outside: add(node, 'td', 'out'), used: add(node, 'td'), per1: add(node, 'td') };
      row.moved = add(body, 'tr');
      row.moved.hidden = true;
      row.line = add(row.moved, 'td', 'moved');
      row.line.colSpan = 4;
      row.when = when;
      return row;
    });
  }
  function paintRow(row, p, name) {
    show(row.node, !!p);
    show(row.moved, !!p?.cli);
    if (!p) return;
    const long = p.ms >= DAY;
    put(row.end, p.open ? 'Now' : long ? dayOf.format(p.end) : endOf(p.end));
    tip(row.end, p.open ? '' : `Ended ${long ? endOf(p.end) : new Date(p.end).toLocaleString()}`);
    if (p.cut && !row.early) {
      row.when.append(' ');
      row.early = add(row.when, 'span', 'early');
      row.early.textContent = 'ended early';
      row.early.title = 'Ended before its reset, so it isn’t a whole period.';
    }
    if (row.early) show(row.early, !!p.cut);
    const none = 'wisp has no reading of this period';
    put(row.outside, p.outside === null ? DASH : pctOf(p.outside));
    tip(row.outside, p.outside === null ? none : '');
    put(row.used, p.used === null ? DASH : pctOf(p.used));
    tip(row.used, p.used === null ? none : '');
    put(row.per1, p.per1 === null ? DASH : amount(p.per1, p.unit, p.rough));
    tip(row.per1, p.per1 === null ? 'Too little to say' : '');
    if (p.cli) put(row.line, movedIn(name, p.cli));
  }
  // Returns whether anything on it reads ≈, which is what the footnote explains.
  function paintHist(win, w, name) {
    const past = (w.periods || []).slice(0, SHOWN);
    const has = past.some((p) => !p.open); // an open period alone is the bar over again
    show(win.hist, has);
    const unit = past[0]?.unit;
    put(win.cost, unit === 'mtok' ? 'Tokens for 1%' : 'For 1%');
    win.rows.forEach((row, i) => paintRow(row, has ? past[i] : null, name));
    const said = has ? past.filter((p) => p.cli).map((p) => movedIn(name, p.cli)) : [];
    const line = readingOf(w.shrink, name, said);
    put(win.reading, line);
    show(win.reading, !!line);
    return (has && past.some((p) => p.rough && p.per1 !== null)) || (!!line && !!w.shrink.rough);
  }
  function paintCard(card, r) {
    const name = r.account ? `${r.agentName} · ${r.account}` : r.agentName;
    put(card.name, name);
    tip(card.name, name);
    put(card.rate, rateOf(r));
    show(card.rate, !!card.rate.textContent);
    show(card.none, !r.windows.length);
    const seen = new Set();
    let rough = false;
    for (const w of r.windows) {
      seen.add(w.id);
      if (!card.wins.has(w.id)) card.wins.set(w.id, makeWin(card, w));
      const win = card.wins.get(w.id);
      const pct = Math.round(w.used * 100);
      put(win.label, w.label);
      tip(win.label, w.label);
      put(win.pct, `${pct}%`);
      put(win.when, resetsIn(w.resetsAt));
      if (win.bar.getAttribute('aria-valuenow') !== String(pct)) win.bar.setAttribute('aria-valuenow', String(pct));
      if (win.fill.style.width !== `${Math.min(100, pct)}%`) win.fill.style.width = `${Math.min(100, pct)}%`;
      win.node.classList.toggle('high', w.used >= 0.9);
      if (paintHist(win, w, r.agentName)) rough = true;
    }
    for (const [id, win] of card.wins) if (!seen.has(id)) (win.node.remove(), card.wins.delete(id));
    return rough;
  }
  function paint(rows) {
    note.textContent = rows.length ? '' : 'No harness is set up yet.';
    list.querySelectorAll('.ph').forEach((n) => n.remove());
    const seen = new Set();
    let rough = false;
    rows.forEach((r, i) => {
      const key = `${r.agent}\0${r.account}`;
      seen.add(key);
      if (!cards.has(key)) cards.set(key, makeCard());
      const card = cards.get(key);
      if (paintCard(card, r)) rough = true;
      if (list.children[i] !== card.node) list.insertBefore(card.node, list.children[i] || null);
    });
    for (const [key, card] of cards) if (!seen.has(key)) (card.node.remove(), cards.delete(key));
    put(foot, rough ? '≈ worked out from a running total.' : '');
  }
  function refresh() {
    wisp.usage.accounts().then(paint, (err) => {
      const allow = /Not allowed/.test(err.message);
      note.textContent = allow ? 'Press Allow… on this pane’s bar to see your usage.' : err.message;
      if (cards.size) return;
      list.querySelectorAll('.ph').forEach((n) => n.remove());
      if (allow) setTimeout(refresh, 4000); // as Agent board: it starts the moment it can
    });
  }
  refresh();
  setInterval(refresh, 60000);
</script>
</body>
</html>
