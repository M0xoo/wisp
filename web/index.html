  <main class="stage" id="stage">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/" aria-label="wisp" title="wisp">
        <span class="orb tiny"></span>
      </a>
      <div class="projects" id="projects"></div>
      <button class="update-btn" id="updateBtn" hidden>
        <svg class="i"><use href="#i-update"/></svg><span>Update</span>
      </button>
      <div class="sp-top" id="spTop"></div>
      <button class="icon-btn view-btn" id="viewBtn" aria-pressed="false">
        <svg class="i"><use href="#i-split"/></svg>
      </button>
      <!-- My Stuff in the phone app (stuff.js shows it), where the box beside New task gives way to the floating New task. -->
      <button class="icon-btn stuff-top" id="stuffTop" title="My Stuff" aria-label="My Stuff" aria-pressed="false" hidden><svg class="i"><use href="#i-stuff"/></svg></button>
      <button class="search-btn" id="searchBtn" title="Search">
        <svg class="i"><use href="#i-search"/></svg><span>Search</span><kbd class="mod-k"></kbd>
      </button>
      <!-- You: your account on a grid, and behind it the menu with Machines, Automations and Settings (split.js). -->
      <button class="me-btn" id="meBtn" title="You, Machines, Automations and Settings" aria-label="Account and settings" aria-haspopup="menu" aria-expanded="false"><span class="sf-av out"><svg class="i"><use href="#i-user"/></svg></span></button>
    </header>
    <div class="feed-wrap" id="feedWrap">
      <!-- The top of the task list: New task, My Stuff, and the sidebar.top slot. -->
      <div class="split-top" id="splitTop" hidden>
        <div class="st-row">
          <button class="split-new" id="splitNew" title="New task: back to the prompt box (N)"><svg class="i"><use href="#i-plus"/></svg><span>New task</span><kbd>N</kbd></button>
          <!-- My Stuff (features/stuff.js): what you and your agents kept, as a page in the main pane. -->
          <button class="split-stuff" id="splitStuff" title="My Stuff: what you and your agents kept" aria-label="My Stuff" aria-pressed="false"><svg class="i"><use href="#i-stuff"/></svg></button>
          <span class="sp-side" id="spSide"></span>
        </div>
      </div>
      <div class="launch-slot" id="launchSlot">
        <!-- First paint, before the scripts load: the launcher's shape with quiet placeholders where its
             chips and buttons go, and a box you can already type in. renderLauncher() fades the real
             ones in over them and keeps what was typed. -->
        <section class="launcher card skel" id="launcher" aria-busy="true">
          <div class="l-projects"><span class="l-in">in</span><span class="lp-group"><i class="sk sk-chip"></i><i class="sk sk-chip short"></i><i class="sk sk-chip"></i></span></div>
          <textarea id="prompt" rows="2" spellcheck="false" autofocus placeholder="What should I go do? Paste screenshots, drop logs or videos…"></textarea>
          <div class="l-bar"><i class="sk sk-btn"></i><i class="sk sk-btn"></i><i class="sk sk-btn"></i><i class="sk sk-pill"></i><i class="sk sk-btn"></i><span class="grow"></span><i class="sk sk-btn"></i><button class="send" tabindex="-1" aria-hidden="true"><svg class="i"><use href="#i-enter"/></svg></button></div>
          <div class="l-recipes"><i class="sk sk-line short"></i><i class="sk sk-line"></i></div>
        </section>
      </div>
      <div class="sp-feedtop" id="spFeedTop" hidden></div>
      <div class="feed" id="feed">
        <section class="f-group needs" id="secNeeds" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="true"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Needs you</span><span class="n"></span></h4><div class="f-list"></div></section>
        <!-- The crew (features/crew.js): named agents that stay on hand, pinned above Working. -->
        <section class="f-group crew" id="secCrew" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="true"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Crew</span><span class="n"></span></h4><button class="cr-org" type="button" title="Org: who on your crew hands work to whom" aria-pressed="false" hidden><svg class="i"><use href="#i-org"/></svg><span>Org</span></button><button class="cr-add" type="button" title="Add a crew member" aria-label="Add a crew member"><svg class="i"><use href="#i-plus"/></svg></button><div class="cr-list"></div></section>
        <section class="f-group working" id="secWorking" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="true"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Working</span><span class="n"></span></h4><div class="f-list"></div></section>
        <section class="f-group scheduled" id="secScheduled" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="true"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Scheduled</span><span class="n"></span></h4><div class="f-list"></div></section>
        <section class="f-group for-later" id="secForLater" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="true"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">For later</span><span class="n"></span><span class="fl-new" hidden></span></h4><div class="f-list"></div></section>
        <section class="f-group done" id="secDone" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Done</span><span class="n"></span></h4><div class="f-list"></div></section>
        <section class="f-group done archived" id="secArchived" hidden><h4 class="sec-toggle" role="button" tabindex="0" aria-expanded="false"><svg class="i chev"><use href="#i-chevron"/></svg><span class="sec-name">Archived</span><span class="n"></span></h4><div class="f-list"></div></section>
      </div>
      <div class="feed-empty" id="feedEmpty" hidden></div>
    </div>
    <!-- The main pane (features/split.js): home is the prompt box; an open task shows its header
         here and its body is laid over #splitStage. Stacked, it's a page over the list. -->
    <section class="split-main" id="splitMain" hidden>
      <div class="split-drag" aria-hidden="true"></div>
      <div class="split-home" id="splitHome">
        <!-- Stacked (narrow windows, the phone app), home is a page over the list: Back to it. -->
        <div class="sh-bar"><button class="icon-btn sh-back" title="Back to tasks" aria-label="Back to tasks"><svg class="i"><use href="#i-back"/></svg></button><h2 class="sh-hello">What should wisp do next?</h2></div>
        <div class="sh-launch"></div>
        <div class="sh-next"></div>
        <div class="sh-next sh-coming" hidden></div>
        <div class="sh-tips tips" hidden></div>
        <p class="sh-keys"></p>
        <!-- Bugs and ideas for the wisp team (feedback.js); hidden when feedback is off on this install. -->
        <p class="sh-foot"><button class="sh-fb" hidden><svg class="i"><use href="#i-bug"/></svg>Hit a bug, or wish wisp did something? Tell us</button></p>
      </div>
      <header class="split-head" id="splitHead" hidden></header>
      <div class="split-stage" id="splitStage" hidden></div>
    </section>
    <div class="split-grip" id="splitGrip" role="separator" aria-orientation="vertical" aria-label="Resize the task list" title="Drag to resize · double-click to reset" hidden></div>
  </main>

  <button class="to-top" id="toTop" title="Back to top (U)" aria-label="Back to top" aria-keyshortcuts="U" hidden>
    <svg class="i"><use href="#i-send"/></svg><kbd>U</kbd>
  </button>
  <div class="drag-strip"></div>
  <div class="sp-float" id="spFloat" hidden></div>
  <!-- The avatar's menu (split.js openMe): you on the grid, or that you're not connected, then
       Machines, Automations, Get the app and Settings. Kept here while closed. -->
  <div class="menu me-menu" id="meMenu" role="menu" hidden>
    <a class="sf-me" id="splitMe" role="menuitem" target="_blank" rel="noopener" tabindex="0"></a>
    <div class="me-nav" id="splitNav" role="none">
      <button class="auto-btn machines-btn" id="machinesBtn" role="menuitem" title="Machines: run agents on another computer over SSH">
        <svg class="i"><use href="#i-server"/></svg><span>Machines</span><b class="ab-n" hidden></b>
      </button>
      <button class="auto-btn" id="autoBtn" role="menuitem" title="Automations: recipes and triggers">
        <svg class="i"><use href="#i-bolt"/></svg><span>Automations</span><b class="ab-n" hidden></b>
      </button>
      <button class="auto-btn getapp-btn" id="getAppBtn" role="menuitem" title="Get the wisp desktop app" hidden>
        <svg class="i"><use href="#i-laptop"/></svg><span>Get the app</span>
      </button>
      <button class="auto-btn" id="settingsBtn" role="menuitem" title="Settings"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></button>
    </div>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts"></div>

  <!-- Split view (the only layout) from the first paint, not when app.js has loaded (slow over the
       network, e.g. on Grid). Mirrors enter() and paintProps() in features/split.js (900 =
       SPLIT_MIN_WIDTH): under it, and in the phone app, the panes stack. applyView() takes over. -->
  <script>(function () {
    var q = function (s) { return document.querySelector(s); };
    var get = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
    var stack = document.body.classList.contains('wisp-mobile') || !matchMedia('(min-width: 900px)').matches;
    var hidden = !stack && get('wisp.sideHidden');
    var w = get('wisp.sideW');
    if (w > 0) document.documentElement.style.setProperty('--side-w', w + 'px');
    q('#splitHome .sh-launch').append(q('#launchSlot'), q('#spFeedTop'));
    var me = get('wisp.me');
    if (me && me.av) { q('#meBtn').innerHTML = me.av; q('#splitMe').innerHTML = me.html; if (me.href) q('#splitMe').href = me.href; q('#splitMe').title = me.title; }
    document.body.classList.add('split');
    if (stack) document.body.classList.add('stack');
    if (hidden) document.body.classList.add('side-hidden');
    ['#splitMain', '#splitGrip', '#splitTop'].forEach(function (s) { q(s).hidden = false; });
  })();</script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
