  <main class="stage" id="stage">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/">
        <span class="orb tiny"></span>
        <span class="word">wisp</span>
      </a>
      <div class="projects" id="projects"></div>
      <button class="update-btn" id="updateBtn" hidden>
        <svg class="i"><use href="#i-update"/></svg><span>Update</span>
      </button>
      <button class="auto-btn machines-btn" id="machinesBtn" title="Machines: run agents on another computer over SSH">
        <svg class="i"><use href="#i-server"/></svg><span>Machines</span><b class="ab-n" hidden></b>
      </button>
      <button class="auto-btn" id="autoBtn" title="Automations: recipes and triggers">
        <svg class="i"><use href="#i-bolt"/></svg><span>Automations</span><b class="ab-n" hidden></b>
      </button>
      <div class="sp-top" id="spTop"></div>
      <button class="icon-btn view-btn" id="viewBtn" aria-pressed="false">
        <svg class="i"><use href="#i-split"/></svg>
      </button>
      <button class="search-btn" id="searchBtn" title="Search">
        <svg class="i"><use href="#i-search"/></svg><span>Search</span><kbd class="mod-k"></kbd>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg class="i"><use href="#i-settings"/></svg>
      </button>
    </header>
    <div class="feed-wrap" id="feedWrap">
      <!-- Split view only: the top of the task list. -->
      <div class="split-top" id="splitTop" hidden>
        <button class="split-new" id="splitNew" title="New task: back to the prompt box (N)"><svg class="i"><use href="#i-plus"/></svg><span>New task</span><kbd>N</kbd></button>
        <span class="sp-side" id="spSide"></span>
      </div>
      <div class="launch-slot" id="launchSlot">
        <!-- First paint, before the scripts load: the launcher's shape with quiet placeholders where its
             chips and buttons go, and a box you can already type in. renderLauncher() fades the real
             ones in over them and keeps what was typed. -->
        <section class="launcher card skel" id="launcher" aria-busy="true">
          <div class="l-projects"><span class="l-in">in</span><span class="lp-group"><i class="sk sk-chip"></i><i class="sk sk-chip short"></i><i class="sk sk-chip"></i></span></div>
          <textarea id="prompt" rows="2" spellcheck="false" autofocus placeholder="What should I go do? Paste screenshots, drop logs or videos…"></textarea>
          <div class="l-bar"><i class="sk sk-btn"></i><i class="sk sk-btn"></i><i class="sk sk-btn"></i><i class="sk sk-pill"></i><i class="sk sk-btn"></i><span class="grow"></span><i class="sk sk-btn"></i><button class="send" tabindex="-1" aria-hidden="true"><svg class="i"><use href="#i-enter"/></svg></button></div>
          <div class="l-recipes"><i class="sk sk-line short"></i><i class="sk sk-line"></i></div>
        </section>
      </div>
      <div class="feed-head" id="feedHead"></div>
      <div class="sp-feedtop" id="spFeedTop" hidden></div>
      <div class="feed" id="feed">
        <section class="f-group needs" id="secNeeds" hidden><h4>Needs you<span class="n"></span></h4><div class="f-list"></div></section>
        <section class="f-group working" id="secWorking" hidden><h4>Working<span class="n"></span></h4><div class="f-list"></div></section>
        <section class="f-group done" id="secDone" hidden><h4 class="toggle-done">Done<span class="n"></span><svg class="i chev"><use href="#i-chevron"/></svg></h4><div class="f-list"></div></section>
        <section class="f-group done archived" id="secArchived" hidden><h4 class="toggle-done">Archived<span class="n"></span><svg class="i chev"><use href="#i-chevron"/></svg></h4><div class="f-list"></div></section>
      </div>
      <div class="feed-empty" id="feedEmpty" hidden></div>
    </div>
    <!-- Split view only (features/split.js): home is the prompt box; an open task shows its header
         here and its body is laid over #splitStage. -->
    <section class="split-main" id="splitMain" hidden>
      <div class="split-home" id="splitHome">
        <h2 class="sh-hello"></h2>
        <div class="sh-launch"></div>
        <div class="sh-next"></div>
        <p class="sh-keys"></p>
      </div>
      <header class="split-head" id="splitHead" hidden></header>
      <div class="split-stage" id="splitStage" hidden></div>
    </section>
    <div class="split-grip" id="splitGrip" role="separator" aria-orientation="vertical" aria-label="Resize the task list" title="Drag to resize · double-click to reset" hidden></div>
  </main>

  <button class="to-top" id="toTop" title="Back to top (U)" aria-label="Back to top" aria-keyshortcuts="U" hidden>
    <svg class="i"><use href="#i-send"/></svg><kbd>U</kbd>
  </button>
  <div class="drag-strip"></div>
  <div class="sp-float" id="spFloat" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
