[package]
name = "wisp"
version = "0.0.0"
description = "wisp desktop shell"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
# The QA driver (src/qa.rs): `cargo build --features qa`. qa/desktop-tauri.mjs uses it. Never shipped.
qa = ["dep:serde_json"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = { version = "1", optional = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Pinned to what wry uses: src/macos.rs talks to the same WKWebView.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSControl", "NSDockTile", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL", "NSURLRequest", "NSUserDefaults"] }
objc2-web-kit = { version = "0.3", features = ["WKFrameInfo", "WKNavigationAction", "WKNavigationDelegate", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

# Pinned to what wry uses: src/linux.rs talks to the same WebKitGTK view.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

# Pinned to what wry uses: src/windows.rs talks to the same WebView2.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
