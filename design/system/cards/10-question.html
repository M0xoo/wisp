<!-- @card group="Components" title="Question card" -->
<h1>Question card</h1>
<p>What needs the person: a question mid-run (<code>.ask-card</code>, amber border) or the result's question (<code>.b-question</code>, accent). Never covered by a toast, the FAB or a popover; spells can't hide it.</p>
<div class="ask-card">
  <div class="q-head"><svg class="i"><use href="#i-ask"/></svg><span>Claude Code is asking</span></div>
  <p class="q-text">Keep the old API for a release, or remove it now?</p>
  <div class="q-opts">
    <button class="opt"><span class="k">1</span><span>Keep it one release<small>Deprecation warning in 0.46</small></span></button>
    <button class="opt"><span class="k">2</span><span>Remove it now</span></button>
    <button class="opt own">Something else…</button>
  </div>
</div>
