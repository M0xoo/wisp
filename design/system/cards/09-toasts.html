<!-- @card group="Components" title="Toasts" -->
<h1>Toasts</h1>
<p><code>toast()</code> only, never hand-placed. One action at most; two choices, or anything that needs the person, goes inline. Errors roll the optimistic change back.</p>
<div class="ds-toasts">
  <div class="toast" role="status"><div class="t-in"><span class="t-glyph"><i class="t-orb"></i></span><span class="t-msg">Saved for later</span><button class="t-act">Undo</button><button class="t-x" aria-label="Close" title="Close"><svg class="i"><use href="#i-x"/></svg><svg class="t-time" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" pathLength="100"/></svg></button></div></div>
  <div class="toast bad" role="alert"><div class="t-in"><span class="t-glyph"><svg class="i"><use href="#i-warn"/></svg></span><span class="t-msg">Couldn't mark it done: <b>the server is offline</b></span><button class="t-x" aria-label="Close" title="Close"><svg class="i"><use href="#i-x"/></svg><svg class="t-time" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" pathLength="100"/></svg></button></div></div>
</div>
