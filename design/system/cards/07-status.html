<!-- @card group="Components" title="Pills, dots and live state" -->
<h1>Pills, dots and live state</h1>
<p>State words from copy.md. Green done, amber waiting on you, red error. One busy signal: the orb.</p>
<h2>.pill</h2>
<div class="ds-row">
  <span class="pill st-done"><i></i>Finished</span>
  <span class="pill st-waiting"><i></i>Needs you</span>
  <span class="pill st-partial"><i></i>Partial</span>
  <span class="pill st-blocked"><i></i>Failed</span>
  <span class="pill st-info"><i></i>Report</span>
  <span class="pill later-pill"><svg class="i"><use href="#i-clock"/></svg>Mon 9:00</span>
</div>
<h2>.q-dot (a row's project dot)</h2>
<div class="ds-row c-violet"><span class="q-dot"></span><span class="q-dot live"></span><span class="q-dot waiting"></span><span class="xs muted">project · live · waiting</span></div>
<h2>.orb</h2>
<div class="ds-row"><span class="orb"></span><span class="orb tiny"></span><span class="orb live"></span><span class="xs muted">mark · brand · working (the only busy signal)</span></div>
