<!-- @card group="Components" title="Buttons" -->
<h1>Buttons</h1>
<p>Labels say what happens. Never OK, Submit or Yes. Icon-only buttons have <code>aria-label</code> and <code>title</code>.</p>
<h2>.primary · .primary.sm</h2>
<div class="ds-row"><button class="primary">Send <kbd>↵</kbd></button><button class="primary sm">Ship it</button><button class="primary" disabled>Send</button></div>
<h2>.ghost · .sm · .xs · .danger · .on</h2>
<div class="ds-row">
  <button class="ghost"><svg class="i"><use href="#i-rerun"/></svg>Rerun…</button>
  <button class="ghost sm"><svg class="i"><use href="#i-bookmark"/></svg>Save for later</button>
  <button class="ghost xs">Undo</button>
  <button class="ghost danger"><svg class="i"><use href="#i-trash"/></svg>Delete task</button>
  <button class="ghost on"><svg class="i"><use href="#i-done"/></svg>Mark done</button>
</div>
<h2>.icon-btn (32×32)</h2>
<div class="ds-row">
  <button class="icon-btn" aria-label="Search" title="Search"><svg class="i"><use href="#i-search"/></svg></button>
  <button class="icon-btn" aria-label="Settings" title="Settings"><svg class="i"><use href="#i-settings"/></svg></button>
  <button class="icon-btn" aria-label="More" title="More"><svg class="i"><use href="#i-dots"/></svg></button>
</div>
<h2>.link · kbd</h2>
<div class="ds-row"><a class="link" href="#">Open the PR</a><span class="muted xs"><kbd>⌘</kbd> <kbd>K</kbd> palette</span></div>
