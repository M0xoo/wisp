<!-- @card group="Components" title="Form kit" -->
<h1>Form kit</h1>
<p>One look for every standalone control (<code>base.css</code>). Components set only layout. Never a native <code>confirm()</code>, never a twelfth input style.</p>
<div class="ds-col">
  <input class="input" placeholder="Name this recipe">
  <input class="input mono" value="~/code/wisp">
  <label class="field"><svg class="i"><use href="#i-search"/></svg><input placeholder="Search tasks"></label>
  <input class="input sm" placeholder=".sm: 30px rows in dense panels">
  <input class="input lg" placeholder=".lg: 38px add-a-project row">
  <input class="input" aria-invalid="true" value="every monday at 25:00">
  <textarea class="textarea" placeholder="What should this crew member know?"></textarea>
  <label class="check"><input type="checkbox" checked>Learn from your picks</label>
  <input class="input" disabled value="Disabled: opacity 0.55, not hidden">
</div>
<p class="ds-note">In a panel tinted <code>--surface-2</code>, set <code>--field-bg: var(--surface)</code>. Phone-facing inputs are 16px (iOS zooms under 16).</p>
