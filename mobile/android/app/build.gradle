apply plugin: 'com.android.application'

android {
    namespace = "dev.trywisp.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.trywisp.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every Play upload needs a higher versionCode: CI passes -PversionCode (android.yml).
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName((project.findProperty('versionName') ?: '1.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packagingOptions {
        // sshj brings BouncyCastle, whose jars each carry these.
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    // Play upload key: android/keystore.properties (gitignored) names the keystore and its
    // passwords. Without it, release builds come out unsigned.
    def keystoreFile = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystoreFile.exists()) {
            def ks = new Properties()
            keystoreFile.withInputStream { ks.load(it) }
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// v2's remote bootstrap, the same file desktop wisp sends (plugins/machines/core/bootstrap.sh), with
// the wisp version to install and where it downloads from filled in as bootstrap.rs does. Bootstrap.java
// fills the rest per computer.
def wispRoot = file('../../..')
def wispVersion = { ->
    def m = (new File(wispRoot, 'Cargo.toml').text =~ /(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"/)
    m.find() ? m.group(1) : '0.0.0'
}
def wispAssets = layout.buildDirectory.dir('generated/wisp-assets').get().asFile
def wispBootstrap = tasks.register('wispBootstrap') {
    def from = new File(wispRoot, 'plugins/machines/core/bootstrap.sh')
    inputs.file(from)
    inputs.file(new File(wispRoot, 'Cargo.toml'))
    outputs.dir(wispAssets)
    doLast {
        def v = wispVersion()
        def to = new File(wispAssets, 'wisp/bootstrap.sh')
        to.parentFile.mkdirs()
        to.text = from.text.replace('__VERSION__', "'${v}'").replace('__DIST__', "'https://github.com/M0xoo/wisp/releases/download/v${v}'")
    }
}
android.sourceSets.main.assets.srcDir(wispAssets)
preBuild.dependsOn(wispBootstrap)

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // SSH: connect, run wisp's bootstrap script, forward its port (see WispSshPlugin).
    implementation "com.hierynomus:sshj:0.41.2"
    implementation "org.bouncycastle:bcprov-jdk18on:1.84" // registered first: Android's own BC lacks Ed25519
    implementation "org.slf4j:slf4j-nop:2.0.17"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
