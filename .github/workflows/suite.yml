name: suite

# The v2 suite on a matrix, called by pr.yml (Linux, Node 22 + 24), main.yml (every OS) and
# nightly.yml (every OS, Node latest too, three times over). Structure rules, types, the tools' own
# tests, then every workspace package through monoflow (ADR-0001). No network beyond the installs, no
# accounts: tests use fakes. Each job uploads monoflow's JSON result for gate G14 (tools/g14.ts).
on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runners
        type: string
        default: '["ubuntu-latest"]'
      node:
        description: JSON list of Node versions
        type: string
        default: '["22", "24"]'
      repeat:
        description: Runs of monoflow verify --all per job; more than one surfaces flaky tests
        type: number
        default: 1
      artifact:
        description: Prefix of the uploaded verify-all artifacts (unique per caller in one workflow run)
        type: string
        default: verify-all

jobs:
  suite:
    name: suite (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.repeat > 1 && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # monoflow: built once per OS and pin (the pin lives in tools/setup-monoflow.ts, so editing it
      # busts the cache), never `monoflow init` (no hooks, no git shim: plan §9.4.3).
      - id: monoflow-cache
        uses: actions/cache@v4
        with:
          path: .agents/bin
          key: monoflow-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup-monoflow.ts') }}
      - if: steps.monoflow-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: node tools/setup-monoflow.ts --build

      # The Rust workspace (ADR-0013): clippy pedantic with -D warnings, every crate's tests, and cargo
      # deny (licences, advisories, bans, sources: deny.toml). Builds share one cached target dir.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run typecheck
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # a container action: Linux runners only (licences and advisories don't vary by OS)
      - name: cargo deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: tools tests
        run: node --test --test-reporter=dot "tools/**/*.test.ts"

      # Every run, even after a failing one, so a nightly says how flaky a package is (2 of 3).
      # --no-cache: a repeat must really run again.
      - name: monoflow verify --all (${{ inputs.repeat }}×)
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 ${{ inputs.repeat }}); do
            echo "::group::run $i of ${{ inputs.repeat }}"
            .agents/bin/monoflow verify --all --no-cache --json > "verify-all-$i.json" || { failed=$((failed + 1)); echo "::error::monoflow verify --all: run $i of ${{ inputs.repeat }} failed"; }
            node tools/monoflow-report.ts "verify-all-$i.json" --title="verify --all, run $i (${{ matrix.os }}, node ${{ matrix.node }})"
            echo "::endgroup::"
          done
          cp verify-all-1.json verify-all.json
          [ "$failed" = 0 ]

      # The published bundle still builds (v1 ran prepublishOnly here), once tools/bundle.ts exists.
      - if: hashFiles('tools/bundle.ts') != ''
        run: npm run build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-${{ matrix.os }}-node${{ matrix.node }}
          path: verify-all*.json
          if-no-files-found: ignore
          retention-days: 90
