name: suite

# The test suite on a matrix, called by pr.yml (fast), main.yml (every OS) and nightly.yml
# (every OS and Node, several times over). Adapters, process launching, terminals and the full
# ask_user loop, against fake CLIs that speak each harness's real output format. No network,
# no accounts, and no install step: wisp has no runtime dependencies.
on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runners
        type: string
        default: '["ubuntu-latest"]'
      node:
        description: JSON list of Node versions
        type: string
        default: '["22"]'
      repeat:
        description: Runs of the whole suite per job; more than one surfaces flaky tests
        type: number
        default: 1

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Every run, even after a failing one, so a nightly says how flaky a test is (2 of 3).
      - name: npm test (${{ inputs.repeat }}×)
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 ${{ inputs.repeat }}); do
            echo "::group::run $i of ${{ inputs.repeat }}"
            npm test || { failed=$((failed + 1)); echo "::error::run $i of ${{ inputs.repeat }} failed"; }
            echo "::endgroup::"
          done
          [ "$failed" = 0 ]
      - run: npm run prepublishOnly
