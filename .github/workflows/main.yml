name: main

# After a merge: every OS on Node 22 (the oldest line package.json's engines allow) and Node 24,
# plus the real harness CLIs, so a break the Linux-only PR run can't see (Windows paths and shims,
# macOS) shows up on the commit that made it. monoflow never narrows this tier (plan §9.4.3).
on:
  push:
    branches: [main]
  workflow_dispatch: # also any branch, from the Actions tab or `gh workflow run main --ref <branch>`

concurrency:
  # one run per commit; a newer merge doesn't cancel the older one's result
  group: main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/suite.yml
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node: '["22", "24"]'
  real-clis:
    uses: ./.github/workflows/real-clis.yml
