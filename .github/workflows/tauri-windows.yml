name: tauri windows

# The Tauri window on Windows, on a built installer and a real desktop (windows-latest has one, at
# 1024×768 until a check sets it). Three jobs on the one build, each on a clean runner:
#   desktop  qa/desktop-tauri-win.mjs: WebView2's CDP for the page, real mouse, keys and Win32 for the rest
#   web      qa/web.mjs in Chrome on the same runner, then in the app's own WebView2
#   migrate  a real v0.57.0, then this installer over it (qa/install.mjs --only migrate)
# This builds with the `qa` feature, which no release has, and its artifact isn't named desktop-*,
# which is what release.yml publishes.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'qa/desktop-tauri-win.mjs'
      - 'qa/win32.ps1'
      - 'qa/install.mjs'
      - '.github/workflows/tauri-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-windows-qa-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: tauri-windows-qa-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
      - run: node desktop/scripts/package.mjs --target x86_64-pc-windows-msvc --features qa
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-qa
          if-no-files-found: error
          path: dist/tauri/wisp-*

  desktop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps: &qa
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-qa
          path: dist/tauri
      - run: npm i --prefix "$RUNNER_TEMP/pw" playwright-core
      - run: node qa/desktop-tauri-win.mjs
        if: github.job == 'desktop'
        env:
          PW_DIR: ${{ runner.temp }}/pw
      - name: qa/web.mjs in Chrome, the baseline on this runner
        if: github.job == 'web'
        continue-on-error: true
        env:
          PW_DIR: ${{ runner.temp }}/pw
          QA_OUT: ${{ github.workspace }}/qa/out/chrome
        run: node qa/web.mjs
      - name: qa/web.mjs in the app's WebView2
        if: github.job == 'web'
        env:
          PW_DIR: ${{ runner.temp }}/pw
          QA_OUT: ${{ github.workspace }}/qa/out/webview2
        run: node qa/desktop-tauri-win.mjs --web
      - run: node qa/install.mjs --only migrate
        if: github.job == 'migrate'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-${{ github.job }}
          path: qa/out

  web:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps: *qa

  migrate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps: *qa
