name: tauri windows

# The v2 desktop app on Windows, from its installer, on a real desktop. Two jobs on the one build, each on a clean
# runner (qa/desktop-v2.mjs):
#   desktop  setup.exe /S, then the installed app: its wisp server, v2's page, nothing left after a quit or a crash
#   migrate  the last release installed first, then this installer over it: the app is this build's
# Its artifact isn't named desktop-*, which is what release.yml publishes.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/wisp/src/serve.rs'
      - 'qa/desktop-v2.mjs'
      - '.github/workflows/tauri-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-windows-qa-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: tauri-windows-qa-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
      - run: npm ci # the web build the app carries (desktop/scripts/package.mjs)
      - run: node desktop/scripts/package.mjs --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-qa
          if-no-files-found: error
          path: dist/tauri/wisp-*

  # the installed app: setup.exe /S, then qa/desktop-v2.mjs on what it installed (the wisp binary and web build in
  # resources\app, no Node)
  desktop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-qa
          path: dist/tauri
      - run: node qa/desktop-v2.mjs --install dist/tauri/wisp-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-desktop
          path: qa/out/desktop-v2.md

  # an update: the last release installed first, then this build's installer over it, and the app is this build's
  migrate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-qa
          path: dist/tauri
      - name: The last release's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'wisp-windows-x64-setup.exe' --dir dist/old
      - run: node qa/desktop-v2.mjs --over dist/old/wisp-windows-x64-setup.exe --install dist/tauri/wisp-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-migrate
          path: qa/out/desktop-v2.md
