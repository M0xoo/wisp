name: tauri windows

# The Tauri window on Windows, on a built installer and a real desktop, on x64 (windows-latest) and
# arm64 (windows-11-arm). Three jobs on each build, each on a clean runner:
#   desktop  qa/desktop-tauri-win.mjs: WebView2's CDP for the page, real mouse, keys and Win32 for the rest
#   web      qa/web.mjs in a Chromium browser on the same runner, then in the app's own WebView2
#   migrate  a real v0.57.0 for that arch, then this installer over it (qa/install.mjs --only migrate)
# Electron stays what users get: this builds with the `qa` feature, which no release has, and its
# artifacts aren't named desktop-*, which is what release.yml publishes.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'qa/desktop-tauri-win.mjs'
      - 'qa/win32.ps1'
      - 'qa/install.mjs'
      - '.github/workflows/tauri-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy: &arches
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      # windows-11-arm may come without Rust.
      - run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup toolchain install stable --profile minimal && rustup default stable
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-windows-qa-${{ matrix.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: tauri-windows-qa-${{ matrix.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
      - run: node desktop/scripts/package.mjs --target ${{ matrix.target }} --features qa
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-qa-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/tauri/wisp-*

  desktop:
    needs: build
    strategy: *arches
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: &qa
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: tauri-windows-qa-${{ matrix.arch }}
          path: dist/tauri
      - run: node -p "process.arch" && npm i --prefix "$RUNNER_TEMP/pw" playwright-core
      - run: node qa/desktop-tauri-win.mjs
        if: github.job == 'desktop'
        env:
          PW_DIR: ${{ runner.temp }}/pw
      - name: qa/web.mjs in a browser, the baseline on this runner
        if: github.job == 'web'
        continue-on-error: true
        env:
          PW_DIR: ${{ runner.temp }}/pw
          QA_OUT: ${{ github.workspace }}/qa/out/chrome
        run: node qa/web.mjs
      - name: qa/web.mjs in the app's WebView2
        if: github.job == 'web'
        env:
          PW_DIR: ${{ runner.temp }}/pw
          QA_OUT: ${{ github.workspace }}/qa/out/webview2
        run: node qa/desktop-tauri-win.mjs --web
      - run: node qa/install.mjs --only migrate
        if: github.job == 'migrate'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-windows-${{ github.job }}-${{ matrix.arch }}
          path: qa/out

  web:
    needs: build
    strategy: *arches
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps: *qa

  migrate:
    needs: build
    strategy: *arches
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps: *qa
