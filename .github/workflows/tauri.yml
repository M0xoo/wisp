name: tauri

# The desktop app (desktop/src-tauri) on each OS: it compiles, and the v2 app works (qa/desktop-v2.mjs: the shell runs
# the wisp binary's server and never leaves it behind). release.yml builds the downloads.
on:
  pull_request:
    paths: ['desktop/**', 'crates/wisp/src/serve.rs', 'qa/desktop-v2.mjs', '.github/workflows/tauri.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'crates/wisp/src/serve.rs', 'qa/desktop-v2.mjs', '.github/workflows/tauri.yml']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-
      - run: cargo check --locked
      - name: The QA builds (AppKit's and WebKitGTK's drivers, WebView2's DevTools port)
        run: cargo check --locked --features qa

  # The v2 desktop on every OS (qa/desktop-v2.mjs): the shell starts the wisp binary's server, the page is v2's, and
  # the server never outlives the shell (quit, or killed hard). Linux under Xvfb with a session bus.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebKitGTK, a display and a session bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb dbus-x11
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
          key: tauri-smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-smoke-${{ runner.os }}-
      - run: npm ci
      - run: npm run build --workspace @wisp/web
      - run: cargo build --locked -p wisp
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: qa/desktop-v2.mjs
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          # the wisp binary finds the web build beside or above it: here, the checkout's apps/web/dist
          export WISP_WEB_DIR="$PWD/apps/web/dist"
          cmd=(node qa/desktop-v2.mjs --app "desktop/src-tauri/target/debug/wisp$ext" --wisp "target/debug/wisp$ext")
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a dbus-run-session -- "${cmd[@]}"; else "${cmd[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-v2-${{ runner.os }}
          path: qa/out/desktop-v2.md
