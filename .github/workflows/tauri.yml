name: tauri

# The desktop app's Rust (desktop/src-tauri): all this checks is that it still compiles on each OS.
# release.yml builds the downloads. Nothing else in the repo needs Rust, so it's filtered to it.
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/tauri.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/tauri.yml']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-
      - run: cargo check --locked
      - name: The QA builds (AppKit's driver, WebView2's DevTools port)
        if: runner.os != 'Linux'
        run: cargo check --locked --features qa
