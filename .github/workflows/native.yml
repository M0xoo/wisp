name: native

# wisp-native (native/, plan §7.1): lint and test it, build it for every platform wisp ships to,
# and, when release.yml asks, publish one npm package per platform (the esbuild model):
#
#   @wisp/native-darwin-arm64   aarch64-apple-darwin
#   @wisp/native-darwin-x64     x86_64-apple-darwin
#   @wisp/native-linux-x64      x86_64-unknown-linux-musl   (static)
#   @wisp/native-linux-arm64    aarch64-unknown-linux-musl  (static)
#   @wisp/native-win32-x64      x86_64-pc-windows-msvc      (static CRT)
#   @wisp/native-win32-arm64    aarch64-pc-windows-msvc     (static CRT)
#
# Each package holds bin/wisp-native[.exe] and declares os/cpu, so npm installs only the one that
# matches; @wisp/native finds it, and falls back to Python / script(1) when it isn't there.
#
# On a PR or a push it builds and tests (artifacts are kept for 14 days). release.yml calls it with
#   uses: ./.github/workflows/native.yml
#   with: { version: <server version>, publish: true, tag: latest|next|nightly }
#   permissions: { contents: read, id-token: write }
# and the publish job runs in the `npm` environment (main only), with provenance. npm's trusted
# publisher for each @wisp/native-* package must name release.yml (the caller) and that
# environment; a package's very first publish needs a token (NPM_TOKEN), since npm can only trust
# a publisher for a package that exists.

on:
  pull_request:
    paths: [native/**, packages/native/**, .github/workflows/native.yml]
  push:
    branches: [main]
    paths: [native/**, packages/native/**, .github/workflows/native.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version of the @wisp/native-* packages (the server's version)
        type: string
        required: false
        default: ''
      publish:
        description: Publish the packages to npm
        type: boolean
        default: false
      tag:
        description: npm dist-tag
        type: string
        default: latest
      ref:
        description: "Commit to build (default: the caller's)"
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        required: false

concurrency:
  group: native-${{ github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      # The Windows code is checked from Linux too, so a Unix-only change can't break it unseen.
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc -- -D warnings

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, target: aarch64-apple-darwin, os: macos-14, test: true }
          - { platform: darwin, arch: x64, target: x86_64-apple-darwin, os: macos-14, test: false }
          - { platform: linux, arch: x64, target: x86_64-unknown-linux-musl, os: ubuntu-24.04, test: true }
          - { platform: linux, arch: arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, test: true }
          - { platform: win32, arch: x64, target: x86_64-pc-windows-msvc, os: windows-2022, test: true }
          - { platform: win32, arch: arm64, target: aarch64-pc-windows-msvc, os: windows-11-arm, test: true }
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ matrix.platform == 'win32' && 'wisp-native.exe' || 'wisp-native' }}
      PKG: wisp-native-${{ matrix.platform }}-${{ matrix.arch }}
      # Windows: link the C runtime statically, so the binary needs no VC++ redistributable.
      RUSTFLAGS: ${{ matrix.platform == 'win32' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl
        if: matrix.platform == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}
      - name: cargo test
        if: matrix.test
        working-directory: native
        run: cargo test --locked --target ${{ matrix.target }}
      - name: cargo build --release
        working-directory: native
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.test
        shell: bash
        run: |
          bin=native/target/${{ matrix.target }}/release/$EXE
          "$bin" --version | tee /dev/stderr | grep -q '"type":"hello","protocol":1'
          ls -l "$bin"
          if [ "${{ matrix.platform }}" = linux ]; then
            file "$bin" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          fi
      - uses: actions/setup-node@v4
        if: matrix.test
        with:
          node-version: 24
      # @wisp/native's tests need no install: Node runs the .ts files directly.
      - name: '@wisp/native against this binary, and gate G12'
        if: matrix.test
        shell: bash
        env:
          WISP_NATIVE_BIN: ${{ github.workspace }}/native/target/${{ matrix.target }}/release/${{ matrix.platform == 'win32' && 'wisp-native.exe' || 'wisp-native' }}
          WISP_G12_RUNS: '200'
        working-directory: packages/native
        run: node --test --test-reporter=spec test/*.test.ts test/g12.gate.ts
      - name: Stage the npm package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dir="npm/$PKG"
          mkdir -p "$dir/bin"
          cp "native/target/${{ matrix.target }}/release/$EXE" "$dir/bin/"
          cp LICENSE "$dir/" 2>/dev/null || true
          version="${VERSION:-0.0.0-dev.${GITHUB_SHA::7}}"
          cat > "$dir/package.json" <<JSON
          {
            "name": "@wisp/native-${{ matrix.platform }}-${{ matrix.arch }}",
            "version": "$version",
            "description": "wisp-native for ${{ matrix.platform }} ${{ matrix.arch }}: PTYs and process trees for wisp (https://github.com/${{ github.repository }})",
            "license": "MIT",
            "repository": { "type": "git", "url": "git+https://github.com/${{ github.repository }}.git", "directory": "native" },
            "os": ["${{ matrix.platform }}"],
            "cpu": ["${{ matrix.arch }}"],
            "files": ["bin"],
            "preferUnplugged": true
          }
          JSON
          printf '# @wisp/native-%s-%s\n\nThe wisp-native binary for %s %s. Installed by wisp-agents as an optional dependency; see native/README.md.\n' \
            ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.platform }} ${{ matrix.arch }} > "$dir/README.md"
          cat "$dir/package.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: npm/${{ env.PKG }}
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish && inputs.version != '' }}
    runs-on: ubuntu-24.04
    # Main only; npm's trusted publisher for each package names release.yml and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - uses: actions/download-artifact@v4
        with:
          pattern: wisp-native-*
          path: npm
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/wisp-native-*; do
            name=$(node -p "require('./$dir/package.json').name")
            got=$(node -p "require('./$dir/package.json').version")
            [ "$got" = "$VERSION" ] || { echo "$name was built as $got, not $VERSION"; exit 1; }
            chmod +x "$dir"/bin/* || true
            # A rerun skips what an earlier run already published.
            if npm view "$name@$VERSION" version 2>/dev/null | grep -q .; then
              echo "$name@$VERSION is already on npm"; continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$TAG")
          done
