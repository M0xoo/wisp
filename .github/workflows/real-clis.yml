name: real CLIs

# The real CLIs, installed the way users install them (npm shims on Windows, Cursor's own
# installer). Without accounts they answer "not logged in", which is enough to prove wisp can
# find, start and parse each one on every OS. Called by main.yml and nightly.yml.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    name: real CLIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code, Codex and opencode
        run: npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai
      - name: Install Cursor CLI (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Cursor CLI (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          irm 'https://cursor.com/install?win32=true' | iex
          # The installer edits the user's PATH in the registry; this session needs it too.
          "$env:LOCALAPPDATA\cursor-agent" >> $env:GITHUB_PATH
      # Not in WISP_REAL_REQUIRE yet: the agy installer hasn't been exercised on CI runners.
      - name: Install Antigravity CLI (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Antigravity CLI (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm https://antigravity.google/cli/install.ps1 | iex
      - name: Smoke test
        run: npm run test:real
        env:
          WISP_REAL_REQUIRE: claude,codex,opencode,cursor
          WISP_REAL_TIMEOUT: '180000'
