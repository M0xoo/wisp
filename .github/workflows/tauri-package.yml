name: tauri package

# The Tauri app as downloads, kept as this run's artifacts and released nowhere. release.yml calls
# this on a dry run only: `gh workflow run release --ref <branch> -f dry_run=true`. Electron stays
# what users get. Linux builds each arch on its own runner (Tauri doesn't cross-compile WebKitGTK),
# on 22.04 so the AppImage and the .deb run on glibc 2.35 and up.
#
# Artifacts are named tauri-*: release.yml publishes what's named desktop-*, and that must never
# match these.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: node desktop/scripts/package.mjs --target aarch64-apple-darwin
      - run: node desktop/scripts/package.mjs --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-mac
          if-no-files-found: error
          path: dist/tauri/wisp-*
      # This run's Electron build, for the update onto Tauri (INST-18). macos-latest is Apple silicon.
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macOS
          path: dist/electron
      - run: node qa/install.mjs --old-electron dist/electron/wisp-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-install-gate-mac
          path: qa/out/install.*

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: node desktop/scripts/package.mjs --target x86_64-pc-windows-msvc
      - run: node desktop/scripts/package.mjs --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          if-no-files-found: error
          path: dist/tauri/wisp-*
      - run: node qa/install.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-install-gate-windows
          path: qa/out/install.*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, rows: 'npm,script,brew,app' }
          - { arch: arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, rows: app }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build: WebKitGTK and what linuxdeploy wants. The gate: a display, a session bus (the shell's
      # single-instance lock), FUSE for an AppImage, squashfs-tools to make a newer one.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file xvfb dbus-x11 libfuse2 squashfs-tools
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: node desktop/scripts/package.mjs --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/tauri/wisp-*
      - run: xvfb-run -a dbus-run-session -- node qa/install.mjs --only ${{ matrix.rows }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-install-gate-linux-${{ matrix.arch }}
          path: qa/out/install.*

  sizes:
    needs: [mac, windows, linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-[mwl][ai]*
          merge-multiple: true
          path: dist/tauri
      - name: Sizes against Electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node desktop/scripts/sizes.mjs dist/tauri | tee -a "$GITHUB_STEP_SUMMARY"
