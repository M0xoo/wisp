name: tauri package

# The desktop app as downloads: release.yml's desktop job, for stable, beta, nightly and dry runs
# alike (`gh workflow run release --ref <branch> -f dry_run=true`). It builds, runs the install gate
# on what it built, and keeps the downloads as artifacts named desktop-*: release.yml publishes those
# and nothing else, so the gate's reports are named install-gate-*. It never publishes anything itself.
# Linux has no build yet (desktop/src-tauri/src/main.rs, compile_error until WebKitGTK can tell a frame
# from the page), so it only runs the install gate's npm rows.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: A nightly's version, stamped into package.json before the build; empty keeps package.json's
        type: string
        default: ''

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The app reads its version from package.json: a nightly has to say it's one to update from it.
      - name: Stamp the nightly version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: node desktop/scripts/package.mjs --target aarch64-apple-darwin
      - run: node desktop/scripts/package.mjs --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          if-no-files-found: error
          path: dist/tauri/wisp-*
      # A real Electron release, for the update people on one make onto this build (INST-18): the one
      # INST-40 installs on Windows (ELECTRON in qa/install.mjs). macos-latest is Apple silicon.
      # curl, not gh: this workflow never touches a release.
      - run: mkdir -p dist/electron && curl -fsSLo dist/electron/wisp-mac-arm64.zip https://github.com/M0xoo/wisp/releases/download/v0.57.0/wisp-mac-arm64.zip
      - run: node qa/install.mjs --old-electron dist/electron/wisp-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-mac
          path: qa/out/install.*

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The app reads its version from package.json: a nightly has to say it's one to update from it.
      - name: Stamp the nightly version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: node desktop/scripts/package.mjs --target x86_64-pc-windows-msvc
      - run: node desktop/scripts/package.mjs --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: dist/tauri/wisp-*
      - run: node qa/install.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-windows
          path: qa/out/install.*

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa/install.mjs --only npm,script,brew
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-linux
          path: qa/out/install.*

  # A report, never a gate: a failed lookup here mustn't hold a release.
  sizes:
    needs: [mac, windows]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/tauri
      - name: Sizes against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node desktop/scripts/sizes.mjs dist/tauri | tee -a "$GITHUB_STEP_SUMMARY"
