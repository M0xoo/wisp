name: tauri package

# The desktop app as downloads: release.yml's desktop job, for stable, beta, nightly and dry runs
# alike (`gh workflow run release --ref <branch> -f dry_run=true`). It builds, runs the install gate
# on what it built, and keeps the downloads as artifacts named desktop-*: release.yml publishes those
# and nothing else, so the gate's reports are named install-gate-*. It never publishes anything itself.
# Linux builds each arch on its own runner (Tauri doesn't cross-compile WebKitGTK), on 22.04 so the
# AppImage and the .deb run on glibc 2.35 and up.
#
# Each build also makes the shell alone, for a wisp from npm (bin/desktop-shell.js):
# wisp-shell-<mac|windows>-<arch>.tar.gz, no Node and no wisp files. They're in desktop-* like the
# rest, so a release publishes them and its SHA256SUMS.txt covers them. Linux's
# (wisp-shell-linux-<arch>) would come from the same package.mjs; it isn't made yet, so npm on Linux
# still opens a browser tab.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: A nightly's version, stamped into package.json before the build; empty keeps package.json's
        type: string
        default: ''

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0 && rustup target add x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The app reads its version from package.json: a nightly has to say it's one to update from it.
      - name: Stamp the nightly version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci # the web build the app carries (desktop/scripts/package.mjs)
      - run: node desktop/scripts/package.mjs --target aarch64-apple-darwin
      - run: node desktop/scripts/package.mjs --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          if-no-files-found: error
          path: dist/tauri/wisp-*
      # the gate (qa/desktop-v2.mjs): the app as downloaded runs its own wisp server and leaves nothing behind.
      # macos-latest is Apple silicon.
      - name: The downloaded app runs v2
        run: |
          mkdir -p dist/gate && ditto -x -k dist/tauri/wisp-mac-arm64.zip dist/gate
          node qa/desktop-v2.mjs --app dist/gate/wisp.app/Contents/MacOS/wisp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-mac
          path: qa/out/desktop-v2.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0 && rustup target add aarch64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The app reads its version from package.json: a nightly has to say it's one to update from it.
      - name: Stamp the nightly version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci # the web build the app carries (desktop/scripts/package.mjs)
      - run: node desktop/scripts/package.mjs --target x86_64-pc-windows-msvc
      - run: node desktop/scripts/package.mjs --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: dist/tauri/wisp-*
      - run: node qa/desktop-v2.mjs --install dist/tauri/wisp-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-windows
          path: qa/out/desktop-v2.md

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, rows: 'npm,script,brew,app' }
          - { arch: arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, rows: app }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build: WebKitGTK and what linuxdeploy wants. The gate: a display, a session bus (the shell's
      # single-instance lock), FUSE for an AppImage, squashfs-tools to make a newer one.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file xvfb dbus-x11 libfuse2 squashfs-tools
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tauri-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # The app reads its version from package.json: a nightly has to say it's one to update from it.
      - name: Stamp the nightly version
        if: inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci # the web build the app carries (desktop/scripts/package.mjs)
      - run: node desktop/scripts/package.mjs --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/tauri/wisp-*
      - name: The AppImage runs v2
        run: |
          chmod +x dist/tauri/wisp-linux-${{ matrix.arch }}.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- node qa/desktop-v2.mjs --app dist/tauri/wisp-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-gate-linux-${{ matrix.arch }}
          path: qa/out/desktop-v2.md

  # A report, never a gate: a failed lookup here mustn't hold a release.
  sizes:
    needs: [mac, windows, linux]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/tauri
      - name: Sizes against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node desktop/scripts/sizes.mjs dist/tauri | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The shell archives, with the sums the release will have
        run: |
          (cd dist/tauri && sha256sum wisp-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          for a in mac-arm64 mac-x64 windows-x64 windows-arm64; do grep -q " wisp-shell-$a.tar.gz$" dist/tauri/SHA256SUMS.txt || { echo "::error::no wisp-shell-$a.tar.gz"; exit 1; }; done
