# ADR-0044's budgets for the durable event log: its own workspace, so the bench never joins the shared build.
[package]
name = "events-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
wisp-kernel = { path = "../../crates/wisp-kernel" }
wisp-store = { path = "../../crates/wisp-store" }

[profile.release]
debug = false
codegen-units = 1
lto = "thin"
