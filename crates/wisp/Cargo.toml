[package]
name = "wisp"
description = "The wisp binary: the CLI, the plugin groups (the only place features are named) and the kernel services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wisp"
path = "src/main.rs"

[features]
# Each plugin host crate is a feature (crates/wisp/src/groups.rs): leave one out to drop it from the
# build. `default` is what compiles in the tree today; `full` is every plugin written so far. Move a
# plugin into `default` once its crate builds.
default = ["proc", "machine"]
full = ["proc", "git", "worktrees", "ship", "review", "issues", "machine"]
proc = ["dep:wisp-proc"]
git = ["dep:wisp-git"]
worktrees = ["dep:wisp-worktrees"]
ship = ["dep:wisp-ship"]
review = ["dep:wisp-review"]
issues = ["dep:wisp-issues"]
machine = ["dep:wisp-machine"]

[dependencies]
wisp-kernel.workspace = true
wisp-api.workspace = true
wisp-protocol.workspace = true
wisp-proc = { workspace = true, optional = true }
wisp-git = { path = "../../plugins/git/host", optional = true }
wisp-worktrees = { path = "../../plugins/worktrees/host", optional = true }
wisp-ship = { path = "../../plugins/ship/host", optional = true }
wisp-review = { path = "../../plugins/review/host", optional = true }
wisp-issues = { path = "../../plugins/issues/host", optional = true }
wisp-machine = { path = "../../plugins/machine/host", optional = true }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
