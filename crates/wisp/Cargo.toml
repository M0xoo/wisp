wisp-update = { path = "../../plugins/update/host", optional = true }
bytes.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# io-std: the attached view reads the keyboard (`wisp "task"`, `wisp attach`)
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
portable-pty.workspace = true
wisp-testkit.workspace = true
wisp-grid = { path = "../../apps/grid" }
hmac.workspace = true
sha2.workspace = true

[lints]
workspace = true
